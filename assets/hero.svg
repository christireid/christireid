@font-face{font-family:'CGI';src:url(data:font/woff2;base64,) format('woff2');font-weight:300 700;font-style:italic;}
@font-face{font-family:'DMMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}
.kicker{font:400 15px 'DMMono','SFMono-Regular',Consolas,monospace;letter-spacing:5px;fill:rgba(180,178,210,0.5);}
