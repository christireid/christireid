.line{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 7s cubic-bezier(.16,1,.3,1) 0.4s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.bar{animation:shimmer 5s ease-in-out infinite;}
@keyframes shimmer{0%,100%{opacity:0.85;}50%{opacity:1;}}
.rise{opacity:1;animation:rise 1.2s cubic-bezier(.16,1,.3,1) forwards;}
.d1{animation-delay:0.1s}.d2{animation-delay:0.35s}.d3{animation-delay:0.6s}
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;}}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;}.line{stroke-dashoffset:0;}}
