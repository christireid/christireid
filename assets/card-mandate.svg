<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="Mandate — A supervision console for simulated financial agents.">
<defs>
<linearGradient id="prism" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(17,85%,62%)"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="hsl(181,85%,75%)"/></linearGradient>

<clipPath id="rr"><rect width="1280" height="250" rx="14"/></clipPath>
</defs>
<style>
@font-face{font-family:'CG';src:url(data:font/woff2;base64,) format('woff2');font-weight:300 700;font-style:normal;}
@font-face{font-family:'Outfit';src:url(data:font/woff2;base64,) format('woff2');font-weight:200 600;font-style:normal;}
@font-face{font-family:'DMMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}
.num{font:400 15px 'DMMono','SFMono-Regular',Consolas,monospace;letter-spacing:3px;fill:rgba(180,178,210,0.5);}
.title{font:500 46px 'CG',Georgia,'Times New Roman',serif;fill:#FCFCFE;}
.one{font:300 18px 'Outfit','Segoe UI',Helvetica,Arial,sans-serif;fill:rgba(180,178,210,0.72);}
.chip{font:400 12.5px 'DMMono','SFMono-Regular',Consolas,monospace;letter-spacing:0.5px;}
.status{font:500 12px 'DMMono5','SFMono-Regular',Consolas,monospace;letter-spacing:1.5px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
<g clip-path="url(#rr)">
<rect width="1280" height="250" fill="#0d0d16"/>
<g opacity="0.92">
<line x1="820" y1="130" x2="985" y2="130" stroke="rgba(151,254,255,0.25)" stroke-width="1.2"/>
<line x1="1015" y1="130" x2="1180" y2="130" stroke="rgba(151,254,255,0.25)" stroke-width="1.2" stroke-dasharray="4 5"/>
<circle cx="820" cy="130" r="7" fill="#161624" stroke="#FF7F4D" stroke-opacity="0.8"/>
<text x="820" y="164" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.5)">AGENT</text>
<rect x="985" y="112" width="36" height="36" rx="8" fill="#161624" stroke="#FFD28A" stroke-opacity="0.7">
<animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/></rect>
<text x="1003" y="164" text-anchor="middle" class="chip" fill="#FFD28A">FOUR-EYES</text>
<circle cx="1180" cy="130" r="7" fill="#161624" stroke="#57e39a" stroke-opacity="0.8"/>
<text x="1180" y="164" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.5)">RELEASE</text>
<circle r="4.5" fill="#FF7F4D">
<animateMotion path="M820,130 L1000,130" keyTimes="0;1" keyPoints="0;1" calcMode="spline" keySplines="0.16 1 0.3 1" dur="3s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="3s" repeatCount="indefinite"/>
<animate attributeName="fill" values="#FF7F4D;#FF7F4D;#FFD28A" dur="3s" repeatCount="indefinite"/></circle>
<circle r="4.5" fill="#57e39a">
<animateMotion path="M1003,130 L1180,130" dur="3s" begin="1.5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.5;0.85;1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
</g>
<rect x="0" y="0" width="4" height="250" fill="url(#prism)" opacity="0.9"/>
<text class="num" x="56" y="52">02 / MANDATE</text>
<g><rect x="960" y="34" width="141" height="24" rx="12" fill="none" stroke="#FFD28A" stroke-opacity="0.55"/><circle cx="974" cy="46" r="3" fill="#FFD28A"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="984" y="50" class="status" fill="#FFD28A">91 UNIT / 25 E2E</text></g>
<text class="title" x="56" y="122">Mandate</text>
<text class="one" x="56" y="160">A supervision console for simulated financial agents.</text>
<g><rect x="56" y="188" width="98" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="105" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">TypeScript</text></g><g><rect x="164.0" y="188" width="166" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="247" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">Hash-chained ledger</text></g><g><rect x="340.4" y="188" width="121" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="401" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">Design tokens</text></g><g><rect x="471.2" y="188" width="83" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="513" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">Monorepo</text></g>
<rect x="0.5" y="0.5" width="1279" height="249" rx="14" fill="none" stroke="rgba(151,254,255,0.12)"/>
</g>
</svg>