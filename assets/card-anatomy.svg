<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-label="Anatomy of a Trade — One order, followed from click to settlement.">
<defs>
<linearGradient id="prism" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(17,85%,62%)"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="hsl(181,85%,75%)"/></linearGradient>

<clipPath id="rr"><rect width="1280" height="250" rx="14"/></clipPath>
</defs>
<style>
@font-face{font-family:'CG';src:url(data:font/woff2;base64,) format('woff2');font-weight:300 700;font-style:normal;}
@font-face{font-family:'Outfit';src:url(data:font/woff2;base64,) format('woff2');font-weight:200 600;font-style:normal;}
@font-face{font-family:'DMMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}
.num{font:400 15px 'DMMono','SFMono-Regular',Consolas,monospace;letter-spacing:3px;fill:rgba(180,178,210,0.5);}
.title{font:500 46px 'CG',Georgia,'Times New Roman',serif;fill:#FCFCFE;}
.one{font:300 18px 'Outfit','Segoe UI',Helvetica,Arial,sans-serif;fill:rgba(180,178,210,0.72);}
.chip{font:400 12.5px 'DMMono','SFMono-Regular',Consolas,monospace;letter-spacing:0.5px;}
.status{font:500 12px 'DMMono5','SFMono-Regular',Consolas,monospace;letter-spacing:1.5px;}
@media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
<g clip-path="url(#rr)">
<rect width="1280" height="250" fill="#0d0d16"/>
<g opacity="0.9">
<polyline points="820,150 910,96 1000,168 1090,110 1180,140" fill="none" stroke="rgba(151,254,255,0.22)" stroke-width="1.2"/>
<circle r="4" fill="#FFD28A"><animateMotion path="M820,150 L910,96 L1000,168 L1090,110 L1180,140" dur="6s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;0.6;1" dur="1s" repeatCount="indefinite"/></circle>
<circle cx="820" cy="150" r="5" fill="#161624" stroke="#99FDFF" stroke-opacity="0.5">
<animate attributeName="fill" values="#161624;#99FDFF;#161624" dur="6s" begin="0.0s" repeatCount="indefinite"/></circle>
<text x="820" y="176" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.5)">ORDER</text><circle cx="910" cy="96" r="5" fill="#161624" stroke="#99FDFF" stroke-opacity="0.5">
<animate attributeName="fill" values="#161624;#99FDFF;#161624" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle>
<text x="910" y="122" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.5)">BROKER</text><circle cx="1000" cy="168" r="5" fill="#161624" stroke="#99FDFF" stroke-opacity="0.5">
<animate attributeName="fill" values="#161624;#99FDFF;#161624" dur="6s" begin="2.4s" repeatCount="indefinite"/></circle>
<text x="1000" y="194" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.5)">BOOK</text><circle cx="1090" cy="110" r="5" fill="#161624" stroke="#99FDFF" stroke-opacity="0.5">
<animate attributeName="fill" values="#161624;#99FDFF;#161624" dur="6s" begin="3.5999999999999996s" repeatCount="indefinite"/></circle>
<text x="1090" y="136" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.5)">PRINT</text><circle cx="1180" cy="140" r="5" fill="#161624" stroke="#99FDFF" stroke-opacity="0.5">
<animate attributeName="fill" values="#161624;#99FDFF;#161624" dur="6s" begin="4.8s" repeatCount="indefinite"/></circle>
<text x="1180" y="166" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.5)">SETTLE</text></g>
<rect x="0" y="0" width="4" height="250" fill="url(#prism)" opacity="0.9"/>
<text class="num" x="56" y="52">03 / ANATOMY OF A TRADE</text>
<g><rect x="960" y="34" width="177" height="24" rx="12" fill="none" stroke="#99FDFF" stroke-opacity="0.55"/><circle cx="974" cy="46" r="3" fill="#99FDFF"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="984" y="50" class="status" fill="#99FDFF">5 CHAPTERS / 76 TESTS</text></g>
<text class="title" x="56" y="122">Anatomy of a Trade</text>
<text class="one" x="56" y="160">One order, followed from click to settlement.</text>
<g><rect x="56" y="188" width="128" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="120" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">Scrollytelling</text></g><g><rect x="194.39999999999998" y="188" width="136" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="262" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">Matching engine</text></g><g><rect x="340.4" y="188" width="60" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="370" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">React</text></g><g><rect x="410.4" y="188" width="151" height="26" rx="13" fill="none" stroke="rgba(151,254,255,0.14)"/><text x="486" y="205" text-anchor="middle" class="chip" fill="rgba(180,178,210,0.72)">Deterministic sim</text></g>
<rect x="0.5" y="0.5" width="1279" height="249" rx="14" fill="none" stroke="rgba(151,254,255,0.12)"/>
</g>
</svg>